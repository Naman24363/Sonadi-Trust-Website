{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Went Wrong | Sonadi Charitable Trust</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f9f9f9;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .error-icon { font-size: 5rem; margin-bottom: 20px; }
    h1 { font-size: 6rem; font-weight: 700; color: #e57373; line-height: 1; }
    h2 { font-size: 1.8rem; font-weight: 600; margin: 16px 0 12px; }
    p  { font-size: 1.1rem; color: #666; max-width: 480px; line-height: 1.6; }
    .actions { margin-top: 32px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 6px; font-weight: 600;
      font-size: 1rem; text-decoration: none; transition: 0.2s;
    }
    .btn-primary { background: #4caf50; color: #fff; }
    .btn-primary:hover { background: #45a049; }
    .btn-outline { background: #fff; color: #4caf50; border: 2px solid #4caf50; }
    .btn-outline:hover { background: #4caf50; color: #fff; }
    .note { margin-top: 24px; font-size: 0.9rem; color: #999; }
  </style>
</head>
<body>
  <div class="error-icon">🐕</div>
  <h1>500</h1>
  <h2>Something Went Wrong</h2>
  <p>We're having a temporary issue on our end. Our team has been notified. Please try again in a moment.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Go Home</a>
    <a href="/contact/" class="btn btn-outline"><i class="fas fa-envelope"></i> Contact Us</a>
  </div>
  <p class="note">If this keeps happening, email us at <a href="mailto:sonadicharitytrust@gmail.com">sonadicharitytrust@gmail.com</a></p>
</body>
</html>
